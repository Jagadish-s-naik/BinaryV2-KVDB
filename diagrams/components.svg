<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 680" width="100%" height="100%" style="background-color:#1e1e2e; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#89b4fa"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f38ba8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="35" fill="#cdd6f4" font-size="20" font-weight="bold" text-anchor="middle">kvdb Architecture: Components &amp; Concurrency Model</text>

  <!-- Subgraph Callers -->
  <rect x="40" y="60" width="870" height="80" rx="8" fill="#181825" stroke="#45475a" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="55" y="82" fill="#a6adc8" font-size="13" font-weight="bold">Callers (Clients)</text>
  <rect x="60" y="92" width="250" height="36" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="185" y="115" fill="#cdd6f4" font-size="13" text-anchor="middle">CLI (open, put, get, batch...)</text>
  <rect x="350" y="92" width="250" height="36" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="475" y="115" fill="#cdd6f4" font-size="13" text-anchor="middle">serve (8 worker threads, pipe)</text>
  <rect x="640" y="92" width="250" height="36" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="765" y="115" fill="#cdd6f4" font-size="13" text-anchor="middle">Library API (class DB)</text>

  <!-- Global Lock -->
  <polygon points="475,175 630,205 475,235 320,205" fill="#f9e2af" stroke="#fab387" stroke-width="2"/>
  <text x="475" y="202" fill="#11111b" font-size="13" font-weight="bold" text-anchor="middle">GLOBAL LOCK: threading.Lock</text>
  <text x="475" y="217" fill="#181825" font-size="11" text-anchor="middle">covers put, delete, batch, get, compact, close</text>

  <!-- Engine Subgraph -->
  <rect x="40" y="260" width="870" height="240" rx="8" fill="#181825" stroke="#45475a" stroke-width="1.5"/>
  <text x="55" y="282" fill="#a6adc8" font-size="13" font-weight="bold">kvdb Engine Subsystems</text>

  <rect x="60" y="295" width="240" height="65" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="180" y="322" fill="#a6e3a1" font-size="13" font-weight="bold" text-anchor="middle">Write Path (DB._append_frame)</text>
  <text x="180" y="342" fill="#bac2de" font-size="11" text-anchor="middle">validate, RAM frame, cap, write, fsync</text>

  <rect x="350" y="295" width="250" height="65" rx="6" fill="#313244" stroke="#89dceb" stroke-width="1.5"/>
  <text x="475" y="322" fill="#89dceb" font-size="13" font-weight="bold" text-anchor="middle">In-Memory Index (DB._index)</text>
  <text x="475" y="342" fill="#bac2de" font-size="11" text-anchor="middle">dict: key -&gt; (value_offset, value_len)</text>

  <rect x="640" y="295" width="250" height="65" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="765" y="322" fill="#f38ba8" font-size="13" font-weight="bold" text-anchor="middle">Disk-Full Guard (DB._check_cap)</text>
  <text x="765" y="342" fill="#bac2de" font-size="11" text-anchor="middle">max_bytes, 64 KiB reserve</text>

  <rect x="60" y="390" width="240" height="65" rx="6" fill="#313244" stroke="#cba6f7" stroke-width="1.5"/>
  <text x="180" y="417" fill="#cba6f7" font-size="13" font-weight="bold" text-anchor="middle">Recovery Engine (recover)</text>
  <text x="180" y="437" fill="#bac2de" font-size="11" text-anchor="middle">scan, apply_ops, truncate torn tail</text>

  <rect x="350" y="390" width="250" height="65" rx="6" fill="#313244" stroke="#fab387" stroke-width="1.5"/>
  <text x="475" y="417" fill="#fab387" font-size="13" font-weight="bold" text-anchor="middle">Compaction (compact)</text>
  <text x="475" y="437" fill="#bac2de" font-size="11" text-anchor="middle">stream live, atomic replace, dirsync</text>

  <rect x="640" y="390" width="250" height="65" rx="6" fill="#313244" stroke="#f2cdcd" stroke-width="1.5"/>
  <text x="765" y="417" fill="#f2cdcd" font-size="13" font-weight="bold" text-anchor="middle">Crash-Point Hooks (crash_point)</text>
  <text x="765" y="437" fill="#bac2de" font-size="11" text-anchor="middle">11 points via KVDB_CRASH_POINT</text>

  <!-- Disk Subgraph -->
  <rect x="40" y="530" width="870" height="120" rx="8" fill="#181825" stroke="#45475a" stroke-width="1.5"/>
  <text x="55" y="552" fill="#a6adc8" font-size="13" font-weight="bold">Disk State</text>

  <rect x="100" y="565" width="320" height="60" rx="8" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="2"/>
  <text x="260" y="590" fill="#a6e3a1" font-size="13" font-weight="bold" text-anchor="middle">Authoritative Log (&lt;path&gt;)</text>
  <text x="260" y="610" fill="#bac2de" font-size="11" text-anchor="middle">24B Header + CRC32 Frames</text>

  <rect x="530" y="565" width="320" height="60" rx="8" fill="#1e1e2e" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="690" y="590" fill="#f38ba8" font-size="13" font-weight="bold" text-anchor="middle">Temporary Files (*.compact, *.init)</text>
  <text x="690" y="610" fill="#bac2de" font-size="11" text-anchor="middle">Deleted unconditionally on open</text>

  <!-- Connectors -->
  <line x1="185" y1="128" x2="400" y2="180" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="128" x2="475" y2="175" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="765" y1="128" x2="550" y2="180" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="235" x2="180" y2="295" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="235" x2="475" y2="295" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="360" x2="240" y2="565" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="455" x2="690" y2="565" stroke="#fab387" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 530 595 L 430 595" stroke="#f38ba8" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-dash)"/>
  <text x="480" y="585" fill="#f38ba8" font-size="11" text-anchor="middle">os.replace (atomic)</text>
</svg>

