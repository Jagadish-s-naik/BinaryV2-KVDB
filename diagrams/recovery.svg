<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 640" width="100%" height="100%" style="background-color:#1e1e2e; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#89b4fa"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a6e3a1"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f38ba8"/>
    </marker>
  </defs>

  <text x="475" y="35" fill="#cdd6f4" font-size="20" font-weight="bold" text-anchor="middle">kvdb Recovery Algorithm: Scan, Frame Validation &amp; Torn Tail Truncation</text>

  <!-- O1 -->
  <rect x="350" y="60" width="250" height="38" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="475" y="84" fill="#cdd6f4" font-size="13" font-weight="bold" text-anchor="middle">open(path)</text>

  <!-- O2 -->
  <rect x="300" y="125" width="350" height="42" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="475" y="145" fill="#cdd6f4" font-size="12" font-weight="bold" text-anchor="middle">delete leftover path.compact &amp; path.init</text>
  <text x="475" y="160" fill="#bac2de" font-size="10" text-anchor="middle">unconditionally cleans up aborted routines</text>

  <!-- O3 Diamond -->
  <polygon points="475,195 620,230 475,265 330,230" fill="#181825" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="475" y="226" fill="#f9e2af" font-size="12" font-weight="bold" text-anchor="middle">path missing or 0 bytes?</text>

  <!-- N1 (Create new) -->
  <rect x="50" y="210" width="230" height="45" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="165" y="228" fill="#a6e3a1" font-size="11" font-weight="bold" text-anchor="middle">write path.init, fsync,</text>
  <text x="165" y="244" fill="#cdd6f4" font-size="10" text-anchor="middle">os.replace to path, dirsync</text>

  <!-- O4 Diamond (Header check) -->
  <polygon points="475,300 620,335 475,370 330,335" fill="#181825" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="475" y="331" fill="#f9e2af" font-size="12" font-weight="bold" text-anchor="middle">Header valid?</text>
  <text x="475" y="347" fill="#bac2de" font-size="10" text-anchor="middle">magic, version=1, CRC</text>

  <!-- Error (Header invalid) -->
  <rect x="740" y="315" width="160" height="40" rx="6" fill="#181825" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="820" y="335" fill="#f38ba8" font-size="11" font-weight="bold" text-anchor="middle">raise CorruptFileError</text>
  <text x="820" y="348" fill="#bac2de" font-size="9" text-anchor="middle">file left untouched</text>

  <!-- O5 (Scan loop) -->
  <rect x="350" y="405" width="250" height="40" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="475" y="425" fill="#cdd6f4" font-size="12" font-weight="bold" text-anchor="middle">scan frames from offset 24</text>
  <text x="475" y="440" fill="#bac2de" font-size="10" text-anchor="middle">16 MiB sliding window buffer</text>

  <!-- O6 Diamond (Frame valid?) -->
  <polygon points="475,475 620,510 475,545 330,510" fill="#181825" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="475" y="506" fill="#f9e2af" font-size="12" font-weight="bold" text-anchor="middle">Next frame valid?</text>
  <text x="475" y="522" fill="#bac2de" font-size="10" text-anchor="middle">FORMAT 4 rules 1-8, CRC32</text>

  <!-- O7 (Apply to index) -->
  <rect x="100" y="490" width="180" height="40" rx="6" fill="#313244" stroke="#89dceb" stroke-width="1.5"/>
  <text x="190" y="510" fill="#89dceb" font-size="11" font-weight="bold" text-anchor="middle">apply ops to index</text>
  <text x="190" y="524" fill="#bac2de" font-size="10" text-anchor="middle">in-order: last op wins</text>

  <!-- O8 Diamond (Stop offset < file_size) -->
  <polygon points="760,475 890,510 760,545 630,510" fill="#181825" stroke="#fab387" stroke-width="1.5"/>
  <text x="760" y="506" fill="#fab387" font-size="11" font-weight="bold" text-anchor="middle">stop &lt; file_size?</text>
  <text x="760" y="521" fill="#bac2de" font-size="9" text-anchor="middle">torn tail present?</text>

  <!-- O9 (Truncate) -->
  <rect x="700" y="575" width="220" height="45" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="810" y="595" fill="#f38ba8" font-size="11" font-weight="bold" text-anchor="middle">ftruncate to stop offset</text>
  <text x="810" y="610" fill="#bac2de" font-size="10" text-anchor="middle">then os.fsync(fd)  [Idempotent]</text>

  <!-- READY -->
  <rect x="350" y="580" width="250" height="42" rx="8" fill="#181825" stroke="#a6e3a1" stroke-width="2"/>
  <text x="475" y="605" fill="#a6e3a1" font-size="14" font-weight="bold" text-anchor="middle">READY: accept operations</text>

  <!-- Connectors -->
  <line x1="475" y1="98" x2="475" y2="125" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="167" x2="475" y2="195" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="230" x2="280" y2="230" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="165" y1="255" x2="165" y2="601" stroke="#a6e3a1" stroke-width="1.5"/>
  <line x1="165" y1="601" x2="350" y2="601" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="475" y1="265" x2="475" y2="300" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="335" x2="740" y2="335" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="475" y1="370" x2="475" y2="405" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="445" x2="475" y2="475" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="510" x2="280" y2="510" stroke="#89dceb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 190 490 L 190 425 L 350 425" stroke="#89dceb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="510" x2="630" y2="510" stroke="#fab387" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="545" x2="760" y2="575" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <path d="M 810 575 L 810 550 L 600 595" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M 890 510 L 910 510 L 910 601 L 600 601" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrow-green)"/>
</svg>

