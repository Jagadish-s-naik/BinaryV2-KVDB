<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 640" width="100%" height="100%" style="background-color:#1e1e2e; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#89b4fa"/>
    </marker>
  </defs>

  <text x="475" y="35" fill="#cdd6f4" font-size="20" font-weight="bold" text-anchor="middle">kvdb Compaction Workflow: Streaming, Handle Closure &amp; Atomic Replace</text>

  <!-- C0 -->
  <rect x="250" y="65" width="450" height="42" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="475" y="91" fill="#f9e2af" font-size="13" font-weight="bold" text-anchor="middle">0. hold GLOBAL LOCK (DB._lock)</text>

  <!-- C1 -->
  <rect x="250" y="135" width="450" height="46" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="475" y="157" fill="#cdd6f4" font-size="13" font-weight="bold" text-anchor="middle">1. create path.compact, header generation + 1</text>
  <text x="475" y="173" fill="#bac2de" font-size="11" text-anchor="middle">monotonic generation bump; temp file</text>

  <!-- C2 -->
  <rect x="250" y="210" width="450" height="52" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="475" y="232" fill="#cdd6f4" font-size="13" font-weight="bold" text-anchor="middle">2. write live keys as frames of up to 1,000 puts</text>
  <text x="475" y="250" fill="#bac2de" font-size="11" text-anchor="middle">dead keys &amp; tombstones discarded; fail: delete temp</text>

  <!-- C3 -->
  <rect x="250" y="290" width="450" height="46" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="475" y="312" fill="#cdd6f4" font-size="13" font-weight="bold" text-anchor="middle">3. os.fsync(compact_fd)</text>
  <text x="475" y="328" fill="#bac2de" font-size="11" text-anchor="middle">temp file made completely durable</text>

  <!-- Crash Point compact_after_tmp -->
  <rect x="740" y="300" width="180" height="26" rx="4" fill="#45475a" stroke="#f2cdcd" stroke-width="1"/>
  <text x="830" y="317" fill="#f2cdcd" font-size="10" text-anchor="middle">CP: compact_after_tmp</text>

  <!-- C4 -->
  <rect x="220" y="365" width="510" height="52" rx="8" fill="#181825" stroke="#fab387" stroke-width="2"/>
  <text x="475" y="388" fill="#fab387" font-size="14" font-weight="bold" text-anchor="middle">4. close old fd (Windows Handle Discipline)</text>
  <text x="475" y="406" fill="#cdd6f4" font-size="11" text-anchor="middle">Prevents Win32 sharing violations during os.replace</text>

  <!-- Crash Point compact_before_replace -->
  <rect x="740" y="378" width="180" height="26" rx="4" fill="#45475a" stroke="#f2cdcd" stroke-width="1"/>
  <text x="830" y="395" fill="#f2cdcd" font-size="10" text-anchor="middle">CP: compact_before_replace</text>

  <!-- C5 -->
  <rect x="220" y="445" width="510" height="54" rx="8" fill="#181825" stroke="#a6e3a1" stroke-width="2.5"/>
  <text x="475" y="468" fill="#a6e3a1" font-size="15" font-weight="bold" text-anchor="middle">5. os.replace(path.compact, path)  [ATOMIC SWAP]</text>
  <text x="475" y="488" fill="#cdd6f4" font-size="12" text-anchor="middle">Single atomic rename; path is either 100% old or 100% new</text>

  <!-- Crash Point compact_after_replace -->
  <rect x="740" y="458" width="180" height="26" rx="4" fill="#45475a" stroke="#f2cdcd" stroke-width="1"/>
  <text x="830" y="475" fill="#f2cdcd" font-size="10" text-anchor="middle">CP: compact_after_replace</text>

  <!-- C6 -->
  <rect x="250" y="525" width="450" height="42" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="475" y="545" fill="#cdd6f4" font-size="12" font-weight="bold" text-anchor="middle">6. fsync parent directory</text>
  <text x="475" y="559" fill="#bac2de" font-size="10" text-anchor="middle">POSIX only; safely skipped on Windows</text>

  <!-- C7 -->
  <rect x="250" y="590" width="450" height="42" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="475" y="610" fill="#a6e3a1" font-size="12" font-weight="bold" text-anchor="middle">7. reopen fd, rebuild in-memory index offsets, unlock</text>
  <text x="475" y="624" fill="#bac2de" font-size="10" text-anchor="middle">Compacted database is now live</text>

  <!-- Arrows -->
  <line x1="475" y1="107" x2="475" y2="135" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="181" x2="475" y2="210" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="262" x2="475" y2="290" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="336" x2="475" y2="365" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="417" x2="475" y2="445" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="499" x2="475" y2="525" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="567" x2="475" y2="590" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>

