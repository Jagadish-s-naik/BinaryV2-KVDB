name: kvdb CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13", "3.14"]

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          check-latest: true

      - name: Verify Toolchain
        run: |
          python --version

      - name: Check Syntax Compilation
        run: |
          python -m compileall src/ torture_tool/ tests/ tools/
          python -m py_compile kvdb torture

      - name: Run Unit & Fuzz Test Suite
        run: |
          python -m unittest discover tests -v

      - name: Run Judge Self-Tests (16 Scenarios)
        run: |
          python torture --self-test

      - name: Run Fast Torture Mode Verification (Real Engine)
        run: |
          python torture --seed 42 --iterations 5 --mode contention --ui plain
          python torture --seed 7  --iterations 3 --mode recovery-crash --ui plain
          python torture --seed 99 --iterations 3 --mode large-batches --ui plain
          python torture --seed 123 --iterations 3 --mode fuzz-corrupt --ui plain

      - name: Verify Diagnostic CLI Tools
        run: |
          python tools/inspect_wal.py --help
          python tools/inspect_wal.py torture-work/data.db --frames

      - name: Upload Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            torture-work/
            *.zip
          if-no-files-found: ignore
